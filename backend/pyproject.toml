[project]
name = "autotrader-backend"
version = "0.1.0"
description = "Autotrader backend foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
  "alembic>=1.13.0,<2.0.0",
  "psycopg[binary]>=3.1.0,<4.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "redis>=5.0.0,<6.0.0",
  "celery>=5.4.0,<6.0.0",
  "httpx>=0.27.0,<1.0.0",
  "structlog>=24.2.0,<25.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "minio>=7.2.0,<8.0.0",
  "prometheus-client>=0.21.0,<1.0.0",
  "sentry-sdk[fastapi,celery]>=2.0.0,<3.0.0",
  "opentelemetry-api>=1.28.0,<2.0.0",
  "opentelemetry-sdk>=1.28.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1.0.0",
  "opentelemetry-instrumentation-httpx>=0.49b0,<1.0.0",
  "opentelemetry-instrumentation-celery>=0.49b0,<1.0.0",
  "opentelemetry-instrumentation-redis>=0.49b0,<1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "factory-boy>=3.3.0,<4.0.0",
  "respx>=0.21.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
  "pyright>=1.1.390,<2.0.0",
  "import-linter>=2.1.0,<3.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# The codebase uses single quotes; preserve rather than churn every file.
quote-style = "preserve"

[tool.pyright]
pythonVersion = "3.11"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core does not depend on domain modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "API does not import Celery tasks"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.tasks"]

[[tool.importlinter.contracts]]
name = "Domain modules only cross-import services"
type = "forbidden"
source_modules = ["app.modules.*"]
forbidden_modules = ["app.modules.*.models", "app.modules.*.tasks"]
# Only direct imports are forbidden. A module's services import its own models, so with
# indirect imports forbidden too no module could call another's services (Feature 02 A15).
allow_indirect_imports = true
