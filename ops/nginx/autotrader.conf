upstream autotrader_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream autotrader_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name autotrader.example.com;

    ssl_certificate /etc/letsencrypt/live/autotrader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autotrader.example.com/privkey.pem;

    include /etc/nginx/autotrader/cloudflare-allowlist.conf;

    client_max_body_size 1m;
    # Only errors nginx itself generates (upstream down or timing out during a deploy or
    # crash) get the branded page. Upstream responses pass through untouched:
    # proxy_intercept_errors would replace the API's own 503 problem+json (readiness,
    # statement timeouts) with HTML and hide *why* it is unavailable.
    error_page 502 503 504 =503 /maintenance.html;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Verified-Cloudflare-Peer $remote_addr;
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate $http_tracestate;
    proxy_set_header baggage $http_baggage;

    location = /metrics {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://autotrader_api;
    }

    location / {
        proxy_pass http://autotrader_web;
    }

    location = /maintenance.html {
        internal;
        root /etc/nginx/autotrader;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
    }
}
