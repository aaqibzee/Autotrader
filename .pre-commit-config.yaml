repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  # Prettier as a local node hook with an exact version: the old
  # pre-commit/mirrors-prettier repo is archived and its pinned tag (v3.5.3)
  # never existed, so this job could not even install its hooks.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: prettier --write --ignore-unknown
        additional_dependencies: ['prettier@3.6.2']
        files: '^(web/.*|ops/.*\.(json|md|ya?ml)|\.github/.*\.(json|md|ya?ml)|docker-compose\.yml|README\.md)$'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # ruff through the backend's own environment, so pre-commit and the
      # backend gate always run the same version (the pinned ruff-pre-commit
      # v0.6.9 disagreed with the project's ruff 0.17 on formatting). Same
      # paths as the backend gate: migrations are history and are not rewritten.
      - id: ruff
        name: ruff
        entry: uv run --directory backend ruff check --fix app tests
        language: system
        pass_filenames: false
        files: '^backend/.*\.py$'
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format app tests
        language: system
        pass_filenames: false
        files: '^backend/.*\.py$'
      - id: import-linter
        name: import-linter
        entry: uv run --directory backend lint-imports --no-cache
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: pyright
        entry: uv run --directory backend --with pyright pyright app
        language: system
        pass_filenames: false
        files: '^backend/.*\.py$'
      - id: web-oxlint
        name: web oxlint
        entry: npm --prefix web run lint
        language: system
        pass_filenames: false
        files: '^web/.*\.(js|jsx|ts|tsx)$'
      - id: web-fetch-boundary
        name: web fetch boundary
        entry: node ops/ci/check_web_fetch.mjs
        language: system
        pass_filenames: false
        files: '^web/.*\.(js|jsx|ts|tsx)$'
