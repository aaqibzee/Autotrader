name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    name: Infrastructure configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Shellcheck deploy and storage scripts
        run: >-
          docker run --rm -v "$PWD/ops:/ops:ro" koalaman/shellcheck:v0.10.0 -S warning
          /ops/deploy/deploy.sh /ops/object-storage/start.sh /ops/object-storage/init.sh
      - name: Validate nginx configuration
        run: >-
          docker run --rm -v "$PWD/ops/nginx:/etc/nginx/autotrader:ro" nginx:1.27-alpine sh -ec
          'apk add -q openssl;
          d=/etc/letsencrypt/live/autotrader.example.com; mkdir -p $d;
          openssl req -x509 -nodes -newkey rsa:2048 -subj /CN=ci -keyout $d/privkey.pem -out $d/fullchain.pem 2>/dev/null;
          cp /etc/nginx/autotrader/autotrader.conf /etc/nginx/conf.d/default.conf; nginx -t'

  quality:
    name: Pre-commit quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install backend and web dependencies
        run: uv sync --frozen --directory backend && npm ci --prefix web
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run hooks
        run: pre-commit run --all-files

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      SECRET_KEY: ci-only-secret-not-for-deployment
      DATABASE_URL: postgresql+psycopg://autotrader:ci-only-postgres-password@127.0.0.1:5432/autotrader
      REDIS_BROKER_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6380/1
      POSTGRES_PASSWORD: ci-only-postgres-password
      S3_ROOT_ACCESS_KEY: ci-only-s3-root
      S3_ROOT_SECRET_KEY: ci-only-s3-root-password
      S3_ENDPOINT: 127.0.0.1:9000
      S3_ACCESS_KEY: ci-only-s3-user
      S3_SECRET_KEY: ci-only-s3-secret
      S3_BUCKET: autotrader-uploads
    steps:
      - uses: actions/checkout@v4
      - name: Start local infrastructure
        run: docker compose up -d --wait postgres redis-broker redis-cache object-storage
      - name: Create private object-storage bucket
        run: docker compose run --rm object-storage-init
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check app tests
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check app tests
      - name: Pyright
        working-directory: backend
        run: uv run pyright app
      - name: Enforce import boundaries
        run: uv run --directory backend lint-imports --no-cache --no-logo
      - name: Verify forbidden imports fail the boundary check
        run: uv run --directory backend python ../ops/ci/check_import_boundary.py
      - name: Enforce commit-safe Celery dispatch
        run: python ops/ci/check_celery_dispatch.py
      - name: Backend tests and coverage
        working-directory: backend
        # app/core holds the foundation every feature builds on, so it is gated too.
        run: >-
          uv run pytest -n auto
          --cov=app/core --cov=app/services --cov=app/modules
          --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Migration round trip and drift check
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Seed smoke (taxonomy, 500 demo listings, invariants)
        working-directory: backend
        # Feature 02 §10: the real CLIs on the freshly migrated schema, network-free.
        run: |
          uv run python -m scripts.load_taxonomy
          uv run python -m scripts.seed_demo --listings 500
          uv run python -m scripts.verify_listings

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install backend runtime dependencies
        run: uv sync --directory backend --frozen --no-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci
      - name: Export OpenAPI and regenerate TypeScript declarations
        run: make api-types
      - name: Fail on stale OpenAPI artifacts
        run: git diff --exit-code -- web/lib/api/openapi.json web/lib/api/schema.d.ts
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Enforce typed API client boundary
        run: node ops/ci/check_web_fetch.mjs
      - name: Unit tests and coverage gate
        working-directory: web
        run: npm run test:coverage
      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      ENVIRONMENT: local
      SECRET_KEY: ci-only-e2e-secret-not-for-deployment
      POSTGRES_PASSWORD: ci-only-e2e-postgres-password
      DATABASE_URL: postgresql+psycopg://autotrader:ci-only-e2e-postgres-password@127.0.0.1:5432/autotrader
      REDIS_BROKER_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6380/1
      S3_ROOT_ACCESS_KEY: ci-only-e2e-s3-root
      S3_ROOT_SECRET_KEY: ci-only-e2e-s3-root-password
      S3_ENDPOINT: 127.0.0.1:9000
      S3_ACCESS_KEY: ci-only-e2e-s3-user
      S3_SECRET_KEY: ci-only-e2e-s3-secret
      S3_BUCKET: autotrader-uploads
      FRONTEND_URL: http://127.0.0.1:3000
      BACKEND_URL: http://127.0.0.1:8000
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start local infrastructure
        run: docker compose up -d --wait postgres redis-broker redis-cache object-storage
      - name: Create private object-storage bucket
        run: docker compose run --rm object-storage-init
      - name: Install locked project dependencies
        run: uv sync --directory backend --frozen --no-dev && npm ci --prefix web
      - name: Apply schema migrations
        run: uv run --directory backend alembic upgrade head
      - name: Build the production web server
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build:standalone
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against the production build
        working-directory: web
        env:
          E2E_SKIP_BUILD: '1'
        run: npm run e2e

  security:
    name: Security and dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify secret scanner detects a generated fake key
        run: python ops/ci/check_secret_scanning.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export locked Python dependencies
        working-directory: backend
        run: uv export --frozen --no-dev --format requirements-txt --output-file /tmp/autotrader-requirements.txt
      - name: Audit Python dependencies
        run: uvx pip-audit -r /tmp/autotrader-requirements.txt
      - name: Audit web dependencies
        working-directory: web
        run: npm ci && npm audit --audit-level=high